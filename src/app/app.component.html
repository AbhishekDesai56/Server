<app-header />

<main>
  <div id="dashboard">
    <div class="dashboard-item">
      <app-dashboard-item
        [img]="{src: 'status.png', alt: 'A signal symbol'}"
        title="Server Status"
      >
        <app-server-status />
      </app-dashboard-item>
    </div>

    <div class="dashboard-item">
      <app-dashboard-item
        [img]="{src: 'globe.png', alt: 'A globe'}"
        title="Traffic"
      >
        <app-traffic />
      </app-dashboard-item>
    </div>

    <div class="dashboard-item">
      <app-dashboard-item
        [img]="{src: 'list.png', alt: 'A list of items'}"
        title="Support Tickets"
      >
        <app-tickets />
      </app-dashboard-item>
    </div>
  </div>
</main>
